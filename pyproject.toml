[project]
name = "data-pipeline-core"
version = "0.1.0.dev0"
description = "Reusable plumbing for GCP data-ingestion pipelines: worker runtime, resilience, observability, and storage adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mathieu Dolmen", email = "mathieu.dolmen@gmail.com" }]
keywords = ["gcp", "data-pipeline", "ingestion", "etl", "cloud-run"]
# Runtime dependencies are added per build phase as a real consumer
# (proba-markets-analysis) demands them, so the SDK never carries speculative
# weight. See TODO.md / CHANGELOG.md decision log.
#   - dlt (Phase 1): the load layer behind dlt_sink (parquet → filesystem/GCS).
#   - pydantic-settings, structlog (Phase 2): config and structured logging.
#   - prometheus-client (Phase 3): standard metric series + end-of-run push.
#   - redis (Phase 5): IP-guard sliding-window counters + latest-state cache.
dependencies = [
    "dlt[filesystem,parquet]>=1,<2",
    "prometheus-client>=0.20",
    "pydantic-settings>=2,<3",
    "redis>=5",
    "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline_core"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "fakeredis>=2.23",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libraries that ship without complete type information.
module = ["fakeredis.*", "dlt.*", "fsspec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships partial types; skip following it so its calls are untyped-safe.
module = ["pyarrow.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
