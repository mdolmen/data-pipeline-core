[project]
name = "data-pipeline-core"
version = "0.1.0.dev0"
description = "Reusable plumbing for GCP data-ingestion pipelines: worker runtime, resilience, observability, and storage adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mathieu Dolmen", email = "mathieu.dolmen@gmail.com" }]
keywords = ["gcp", "data-pipeline", "ingestion", "etl", "cloud-run"]
# Runtime dependencies are added per build phase as a real consumer
# (proba-markets-analysis) demands them, so the SDK never carries speculative
# weight. See DEVELOPMENT.md / CHANGELOG.md decision log.
#   - dlt (Phase 1): the load layer behind dlt_sink (parquet → filesystem/GCS).
#   - pydantic-settings, structlog (Phase 2): config and structured logging.
#   - prometheus-client (Phase 3): standard metric series + end-of-run push.
#   - redis (Phase 5): IP-guard sliding-window counters + latest-state cache.
#   - dlt[deltalake] (Phase 7): ACID merge/upsert on GCS objects (idempotency).
#   - httpx: the direct HTTP backend (ctx.http) — imported directly, so declared
#     directly (was only present transitively via the dev-only pytest-httpx; a
#     --no-dev container install dropped it).
#   - fsspec + gcsfs: the storage layer reads/writes file:// locally and gs:// in
#     cloud; gcsfs is the GCS backend fsspec/dlt need for gs:// objects.
dependencies = [
    "curl-cffi>=0.15.0",
    "dlt[filesystem,parquet,deltalake]>=1,<2",
    "fsspec>=2023",
    "gcsfs>=2023",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic-settings>=2,<3",
    "redis>=5",
    "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline_core"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-httpx>=0.30",
    "fakeredis>=2.23",
    "pre-commit>=3.7",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libraries that ship without complete type information.
module = ["fakeredis.*", "dlt.*", "fsspec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow / deltalake / curl_cffi ship partial or over-strict (Literal) types;
# skip following so our dynamic calls into them are untyped-safe.
module = ["pyarrow.*", "deltalake.*", "curl_cffi.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
